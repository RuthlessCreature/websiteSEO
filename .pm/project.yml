name: websiteSEO
summary: Three-site search, AI visibility, social distribution, and individualized outreach for Xiaodu, StayChina, and Pomerol.
status: active
phase: evidence-led-outreach-and-search-analysis
last_reviewed: '2026-10-27'
progress:
  - The active LUNA Goal continues to follow the original 2026-10-25 plan; the execution window is 2026-10-26 through 2026-11-24 with targets of ~300 researched organizations, 120–180 qualified paths, 100–150 individualized first contacts, 3 resources, 3–6 page improvements, and 12–18 published platform-adapted posts.
  - Latest GSC Web Search window (2026-09-30 to 2026-10-24): Xiaodu 1/72, StayChina 2/50, Pomerol 6/1,570 clicks/impressions. AI Search impressions were 2/4/5, not citations. Query×page is only mapped for Pomerol supplier verification; StayChina page rows are non-additive and require export verification. Previous period, country/device, full cross-tabs and AI Performance report remain outstanding.
  - The 2026-10-25 production audit checked 349 sitemap URLs with zero reported issues/warnings in audited fields; weekly monitoring remains. No live site or Cloudflare setting changed during this continuation.
  - Gmail reconciliation: 27 first-contact messages have SENT records, one separate address hard-bounced and is suppressed, two warm/editorial clarification threads are separately counted; the latest five first contacts were sent 2026-10-27 China time. SENT means submitted by Gmail, not delivered or published.
  - Current outreach queue: 121 records / 120 unique organizations / 9 READY_TO_SEND. Gmail has 14 recipient-bearing qualification drafts (9 not marked HOLD, 5 explicitly held), plus 5 sent-copy drafts with recipients cleared and DO NOT SEND subjects.
  - The 2026-10-27 fit review moved iWorld and FIIC to HOLD_BUSINESS_FIT because StayChina's China-inbound audience and their outbound settlement focus lack evidenced two-way demand. AIAG Supply Line moved to HOLD_TOPIC_FIT without verified automotive/trade author experience. Their Gmail draft subjects are marked HOLD.
  - Added X50 Anjian Intelligent after checking its current official partner page and exact-recipient Gmail history. The page explicitly targets system integrators/solution providers, says no franchise fee, and lists partners@zhizao.cloud. A Chinese eligibility-only draft asks about automation/vision integrator fit, requirements and public partner links; it is unsent and contains no phone, customer data or attachments.
  - Audited DOBOT and FIIC drafts and removed the unnecessary mobile number; readback confirmed the saved recipients/body and absence of the phone number. No mail was sent in this continuation.
  - Added S33 China Daily Star as HOLD_AUTHOR_EVIDENCE and P42 Procurement Magazine as HOLD_COST; neither is a sendable path. Current sources and rationale are in the public queue and outreach log.
  - Added P43 GTBP, P44 AcademyGlobal Insights and P45 SCM Globe as official-source research holds. Each requires a qualified human practitioner/author or human-authored original material that is not yet evidenced; no pitch or form was submitted.
  - Live-HTML review captured current title, meta description and H1 for four commercial pages in SEO-核心页面SERP复核-2026-10-27.md. No metadata edit is justified without complete query×page and conversion evidence. StayChina's policy link check date remains 2026-10-08 and requires a qualified source-by-source update.
  - Rechecked Gmail and public sources on 2026-10-27: no new replies, bounces, stop requests or duplicate history for the next batch. Moved S25 GBA News and P30 The Supply Chain Xchange to author-evidence HOLD; removed S25's unnecessary phone number and verified readback. Next candidate set is P28/X50/X25/X26/S26, with a maximum of five after a fresh suppression/source review on 2026-10-28.
  - Rechecked Siemens X14: exact Gmail search returned only the 2026-10-25 sent inquiry and no reply. Its current partner application asks for company street address, annual revenue and employee counts; recorded this as a hard pre-application data gate. Added X51 MVTec Certified Integration Partner as HOLD_PRODUCT_EVIDENCE because MVTec handpicks engineering partners for its software and no HALCON/MERLIC project evidence is verified.
  - Added X52 Mitsubishi Electric e-F@ctory Alliance as HOLD_PRODUCT_EVIDENCE: global sources invite system integrators, but China has a distinct sales entity and no China-specific alliance contact or Xiaodu Mitsubishi project evidence is verified.
  - WFN/IFN's partner offer stated £595 for year one and £995 annual thereafter, with additional meeting/sponsorship options. Yusuf declined the paid package and asked whether a no-fee editorial/resource route exists. No application, payment, referral commitment or client information was sent.
  - 2026-10-27 01:49 Asia/Shanghai Gmail reconciliation found Industrial Automation Monthly's reply to Xiaodu's unpaid article inquiry: its current route is paid Sponsored Content only. Closed as `CLOSED_PAID_ONLY`; no response or paid commitment. Updated the 2026-10-28 batch preflight. The five-cold-first-contact daily cap for 10/27 is reached, so no further first contacts today.
  - 2026-10-27 01:52 Asia/Shanghai: the five proposed 10/28 draft recipients/subjects were rechecked and have one recipient with no attachment; no new replies or bounces for those prospects. The prior hard-bounce address remains suppressed. Existing HROne, China Business Travel and WFN/IFN replies already have thread responses.
  - Added P46 Sourcing100 Sourcing Agent Network after checking its official homepage and directory. The site advertises free agent registration and has service-provider categories, but the currently displayed membership counts are zero and no public profile/indexability, outbound-link, lead-delivery or fee terms are established. Status is HOLD_PUBLIC_CONTACT_AND_VISIBILITY; no signup, application or email. Queue is now 120 records / 119 unique organizations / 9 READY_TO_SEND.
  - 2026-10-27 01:59 Asia/Shanghai: read all five 10/28 batch draft bodies end-to-end; each is a one-recipient inquiry without attachments or unsupported credentials/customer data. Verified HKTDC's free-registration claim against the official registration page. The batch stays unsent until a fresh 10/28 preflight.
  - Added X53 INOVANCE Overseas Service Partner Network after checking its official partner expectations and Xiaodu's live public service scope. INOVANCE offers training/support and content promotion, but expects 5+ years in automation, formal licenses, relevant repair/commissioning capability and product-specific expertise. Xiaodu's site does not establish these criteria; marked HOLD_SERVICE_PARTNER_ELIGIBILITY, no email, form or credentials submitted. Queue is now 121 records / 120 unique organizations / 9 READY_TO_SEND.
blockers:
