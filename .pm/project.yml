  - Research 12–15 new unique organizations per working day from official sources; target 6–9 qualified routes but keep any unsupported, paid or privacy-sensitive route on HOLD.
  - Continue one-to-one email production and follow-up under the original 100–150 first-contact goal; do not use bulk blasts, BCC, guessed contacts or auto-follow-up after a reply.
  - Collect the previous 28-day Search Console comparison with identical filters and export raw CSV if available; map Pomerol queries to landing pages before recommending page edits. The latest Edge UI attempt was again stopped because the Computer Use helper could not determine the active URL confidently; no browser input occurred.
  - Build the three original resources and publish platform-adapted posts only after responsible human review; drafts do not count as published.
  - Review costs, referral rules, rights and data use before any application; do not submit company licenses, financial/employee/address fields or customer data without explicit authorization.
