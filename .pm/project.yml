  - Xiaodu engineering review and StayChina policy/process review for draft resources remain unconfirmed; no named qualified author/evidence is established for several editorial routes.
  - Pomerol's existing RFQ draft overlaps published tools/guides and is not a distinct resource.
next_actions:
