name: Monthly full-site SEO audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-full-site-audit.yml"
      - "seo-tools/seo_full_site_audit.py"
      - "seo-tools/seo_content_triage.py"
  schedule:
    - cron: "43 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-seo-full-site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SEO operations repository
        uses: actions/checkout@v6

      - name: Audit every production sitemap URL
        run: python3 seo-tools/seo_full_site_audit.py

      - name: Triage English main-content depth and case-page overlap
        if: always()
        run: python3 seo-tools/seo_content_triage.py

      - name: Audit homepage structured-data entity relationships
        if: always()
        run: python3 seo-tools/seo_schema_entity_audit.py
