name: Weekly full-site SEO audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-full-site-audit.yml"
      - "seo-tools/seo_full_site_audit.py"
      - "seo-tools/seo_content_triage.py"
      - "seo-tools/seo_schema_entity_audit.py"
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-seo-full-site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SEO operations repository
        uses: actions/checkout@v6

      - name: Audit every production sitemap URL
        run: |
          mkdir -p audit-reports
          set -o pipefail
          python3 seo-tools/seo_full_site_audit.py | tee audit-reports/full-site-audit.md

      - name: Triage English main-content depth and case-page overlap
        if: always()
        run: |
          mkdir -p audit-reports
          set -o pipefail
          python3 seo-tools/seo_content_triage.py | tee audit-reports/content-triage.md

      - name: Audit homepage structured-data entity relationships
        if: always()
        run: |
          mkdir -p audit-reports
          set -o pipefail
          python3 seo-tools/seo_schema_entity_audit.py | tee audit-reports/schema-entity-audit.md

      - name: Save full-site audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-full-site-audit-${{ github.run_number }}
          path: audit-reports/*.md
          if-no-files-found: warn
          retention-days: 90
