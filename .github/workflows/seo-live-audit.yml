name: Weekly three-site SEO live audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-live-audit.yml"
      - "seo-tools/seo_live_audit.py"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-seo-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out SEO operations repository
        uses: actions/checkout@v6

      - name: Audit production sites
        run: python3 seo-tools/seo_live_audit.py

